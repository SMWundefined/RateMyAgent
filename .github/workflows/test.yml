name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One version failing should still report the other three.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv downloads the interpreter itself, so no separate setup-python step.
      - name: Create the virtualenv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install
        run: uv pip install -e '.[dev]'

      - name: Test
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check

  # Standing rule: anything that exists to verify something else runs in CI.
  # `examples/mcp_server_git_repro.py` is what users are pointed at to check a
  # crash report against their own server, including a crash report from us --
  # and it shipped broken under the SDK its own instructions install, because
  # nothing ran it. It talks to a stdlib stub here, so no network and no uvx.
  verification-tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both majors. The 2.x rename is precisely what went unnoticed.
        mcp-version: ["<2", ">=2,<3"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the virtualenv
        run: uv venv --python 3.12

      - name: Install with mcp ${{ matrix.mcp-version }}
        run: |
          uv pip install -e '.[dev]'
          uv pip install 'mcp${{ matrix.mcp-version }}'

      - name: Report the resolved SDK version
        run: uv run python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"

      - name: Verification tools
        run: uv run pytest tests/test_verification_tools.py -q

      - name: The repro script, end to end against the stub
        run: |
          uv run python examples/mcp_server_git_repro.py \
            --server "$(uv run python -c 'import shlex,sys;print(shlex.join([sys.executable,"tests/fixtures/stub_mcp_server.py"]))')"

      # Streamable HTTP against a real server, on both SDK majors. The transport
      # helper indexes the yielded streams rather than unpacking them, because
      # 1.x yields three and 2.x yields two -- a difference invisible to whoever
      # writes the code on whichever major they have installed. This matrix is
      # what makes that concrete rather than a comment.
      - name: Start a Streamable HTTP MCP server
        run: |
          npx -y @modelcontextprotocol/server-everything streamableHttp &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3001/mcp && break
            # A 400 means it is up and objecting to a bare GET, which is enough.
            curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/mcp | grep -q '^[24]' && break
            sleep 1
          done

      - name: Scan it over http://
        run: |
          uv run ratemyagent scan --target mcp --uri http://localhost:3001/mcp \
            --tool echo --tool-args '{"message":"ci"}' \
            --requests 8 --probes latency --output scorecard | tee /tmp/http-scan.txt
          grep -q 'mcp via http' /tmp/http-scan.txt
          # A local HTTP round trip is milliseconds, not sub-millisecond stdio.
          grep -qE 'p50 [0-9.]+ms' /tmp/http-scan.txt
