name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Generous against a real run of a few minutes, and it fails inside a
    # coffee break. Without it a hung step costs the GitHub ceiling of 360
    # minutes: five releases including the 1.0 API freeze went out on jobs that
    # timed out rather than passed, and nobody looked, because "in progress"
    # reads as slow rather than broken.
    timeout-minutes: 15
    strategy:
      # One version failing should still report the other three.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv downloads the interpreter itself, so no separate setup-python step.
      - name: Create the virtualenv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install
        run: uv pip install -e '.[dev]'

      - name: Test
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check

      # A real stdio scan, on every version in the matrix.
      #
      # The matrix used to vary the Python version without varying what ran on
      # it: stdio coverage was mocks plus a subprocess script driving the SDK
      # directly, and the only real scan was http:// on 3.12 in the job below.
      # So `MCPTarget`'s stdio path -- the primary documented use case -- was
      # exercised on exactly one version, and it had been broken on 3.10 and
      # 3.11 since 0.1.8 with four green checkmarks per push.
      #
      # No network and no uvx: it talks to the stdlib stub. If this step had
      # existed, the bug would have been caught the day it shipped.
      - name: Scan a real stdio server
        run: |
          uv run ratemyagent scan --target mcp \
            --uri "stdio://$(uv run python -c 'import sys;print(sys.executable)') tests/fixtures/stub_mcp_server.py --repository /tmp" \
            --tool git_status --tool-args '{"repo_path": "/tmp"}' \
            --requests 5 --scan-timeout 120 --probes latency,contract

  # Standing rule: anything that exists to verify something else runs in CI.
  # `examples/mcp_server_git_repro.py` is what users are pointed at to check a
  # crash report against their own server, including a crash report from us --
  # and it shipped broken under the SDK its own instructions install, because
  # nothing ran it. It talks to a stdlib stub here, so no network and no uvx.
  verification-tools:
    runs-on: ubuntu-latest
    # Higher than `test`: this job installs npm and uv packages over the network
    # and runs real scans against them. Still an order of magnitude under the
    # ceiling that hid the hang.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both majors. The 2.x rename is precisely what went unnoticed.
        mcp-version: ["<2", ">=2,<3"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the virtualenv
        run: uv venv --python 3.12

      - name: Install with mcp ${{ matrix.mcp-version }}
        run: |
          uv pip install -e '.[dev]'
          uv pip install 'mcp${{ matrix.mcp-version }}'

      - name: Report the resolved SDK version
        run: uv run python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"

      - name: Verification tools
        run: uv run pytest tests/test_verification_tools.py -q

      - name: The repro script, end to end against the stub
        run: |
          uv run python examples/mcp_server_git_repro.py \
            --server "$(uv run python -c 'import shlex,sys;print(shlex.join([sys.executable,"tests/fixtures/stub_mcp_server.py"]))')"

      # Streamable HTTP against a real server, on both SDK majors. The transport
      # helper indexes the yielded streams rather than unpacking them, because
      # 1.x yields three and 2.x yields two -- a difference invisible to whoever
      # writes the code on whichever major they have installed. This matrix is
      # what makes that concrete rather than a comment.
      - name: Start a Streamable HTTP MCP server
        run: |
          npx -y @modelcontextprotocol/server-everything streamableHttp &
          ci/wait-for-endpoint.sh respond http://localhost:3001/mcp

      - name: Scan it over http://
        run: |
          # Explicit, not derived. Left unset, the budget comes out at
          # `timeout_s * requests * 4` = 960s -- a number nobody chose, in a job
          # whose whole purpose is to fail fast. Same shape as the 2400s default
          # already fixed for users.
          uv run ratemyagent scan --target mcp --uri http://localhost:3001/mcp \
            --tool echo --tool-args '{"message":"ci"}' --scan-timeout 120 \
            --requests 8 --probes latency --output scorecard | tee /tmp/http-scan.txt
          grep -q 'mcp via http' /tmp/http-scan.txt
          # A local HTTP round trip is milliseconds, not sub-millisecond stdio.
          grep -qE 'p50 [0-9.]+ms' /tmp/http-scan.txt

      # sse:// shipped before 0.1.7 and was first exercised on 2026-09-09 --
      # by hand, against a real server, three years of releases after it became
      # public API. It worked, which proves one run and not the transport. Unit
      # tests cover the branch and the SDK signature; this covers the wire.
      #
      # Deprecated by the 2025-06-18 spec and still what every older server
      # speaks, so "deprecated" is a reason to keep testing it, not to stop.
      # A second port rather than replacing the first: the header-delivery
      # tests below need both transports live at once, and `sse` and
      # `streamableHttp` are different server modes.
      - name: Start the same server over the deprecated SSE transport
        run: |
          PORT=3005 npx -y @modelcontextprotocol/server-everything sse &
          # `stream`, not `respond`: `/sse` holds the connection open, so a bare
          # GET never returns and the readiness check that used one hung for six
          # hours a run. See ci/wait-for-endpoint.sh.
          ci/wait-for-endpoint.sh stream http://localhost:3005/sse

      - name: Scan it over sse://
        run: |
          uv run ratemyagent scan --target mcp --uri sse://localhost:3005/sse \
            --tool echo --tool-args '{"message":"ci"}' --scan-timeout 120 \
            --requests 8 --probes latency --output scorecard | tee /tmp/sse-scan.txt
          grep -q 'mcp via sse' /tmp/sse-scan.txt
          grep -qE 'p50 [0-9.]+ms' /tmp/sse-scan.txt

      # `--header` shipped in 0.1.7 with redaction tested and delivery never
      # tested, and went thirteen releases without an authenticated run against
      # a real server. Redacting a token you never sent is safe and useless.
      # These assert the bytes, through a recording proxy, on both transports.
      - name: Headers reach the wire, both transports
        run: uv run pytest tests/test_targets/test_header_delivery.py -q
