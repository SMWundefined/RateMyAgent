name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    # Generous against a real run of a few minutes, and it fails inside a
    # coffee break. Without it a hung step costs the GitHub ceiling of 360
    # minutes: five releases including the 1.0 API freeze went out on jobs that
    # timed out rather than passed, and nobody looked, because "in progress"
    # reads as slow rather than broken.
    timeout-minutes: 30
    # `uv run` syncs the environment from `uv.lock` before running, which would
    # reinstall the locked `mcp` and silently revert the pin below -- every step
    # would then report the same major whatever the matrix said. That is the
    # shape of section 8b entry 25: a check verified under a different program
    # than the one that runs.
    env:
      UV_NO_SYNC: "1"
    strategy:
      # One version failing should still report the other three.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Both SDK majors, because the suite is what covers them. The
        # `verification-tools` job already varies this for the repro script and
        # the HTTP/SSE scans, but the pytest suite took whatever resolved -- and
        # since 1.3.2 made `mcp` a core dependency, that is always 2.x. The 2.0
        # field rename turned into a silent scoring bug once, through a `getattr`
        # default, so `_sdk_attr` and its regression tests have to run on both.
        mcp-major: ["1", "2"]

    steps:
      # First, before checkout, so the elapsed-time guard at the end of the job
      # covers every step. The runner's own "Set up job" is not counted.
      - name: Start the job clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv downloads the interpreter itself, so no separate setup-python step.
      - name: Create the virtualenv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install
        run: uv pip install -e '.[dev]'

      # After the dev install, so it overrides whatever `mcp` resolved to as a
      # core dependency. Written as a case rather than an inline expression so
      # an unknown value fails the step instead of installing something else.
      - name: Install mcp ${{ matrix.mcp-major }}.x
        run: |
          case "${{ matrix.mcp-major }}" in
            1) spec='mcp>=1,<2' ;;
            2) spec='mcp>=2,<3' ;;
            *) echo "::error::unknown mcp-major ${{ matrix.mcp-major }}"; exit 1 ;;
          esac
          uv pip install "$spec"

      # In the log, so a green run says which major it was green on.
      - name: Report the resolved SDK version
        run: uv run python -c "import mcp.types, importlib.metadata as m; print(m.version('mcp'))"

      # Serial. `pytest-xdist` is in `[dev]` for local use, but parallel runs
      # (`-n 4 --dist loadscope`) flaked 2 in 7 locally. They are deferred
      # until the agent's stderr is logged on the kill path, so the next
      # failure can be diagnosed rather than inferred. FLAKE-1.8.0.
      - name: Test
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check

      # A real stdio scan, on every version in the matrix.
      #
      # The matrix used to vary the Python version without varying what ran on
      # it: stdio coverage was mocks plus a subprocess script driving the SDK
      # directly, and the only real scan was http:// on 3.12 in the job below.
      # So `MCPTarget`'s stdio path -- the primary documented use case -- was
      # exercised on exactly one version, and it had been broken on 3.10 and
      # 3.11 since 0.1.8 with four green checkmarks per push.
      #
      # No network and no uvx: it talks to the stdlib stub. If this step had
      # existed, the bug would have been caught the day it shipped.
      - name: Scan a real stdio server
        run: |
          uv run ratemyagent scan --target mcp \
            --uri "stdio://$(uv run python -c 'import sys;print(sys.executable)') tests/fixtures/stub_mcp_server.py --repository /tmp" \
            --tool git_status --tool-args '{"repo_path": "/tmp"}' \
            --requests 5 --scan-timeout 120 --probes latency,contract

      # Last, and `always()`, so it reports after a failed step too. A job that
      # passes inside its timeout but near it is the next release's timeout:
      # at 1.7.5 the mcp 2.x test jobs reached the 15-minute bound (two were
      # cancelled, one passed at 14:43) and the bound went to 30 with nothing
      # to say how close the suite had come. Failing at 80% makes the margin a
      # failure while it still exists, instead of a cancelled run later.
      - name: Fail if this job used more than 80% of its timeout
        if: always()
        env:
          # Must equal this job's timeout-minutes (tests/test_ci_readiness.py).
          TIMEOUT_MINUTES: 30
        run: |
          : "${JOB_STARTED_AT:?the job clock step did not run}"
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          limit=$(( TIMEOUT_MINUTES * 60 * 8 / 10 ))
          echo "job elapsed ${elapsed}s; limit ${limit}s (80% of ${TIMEOUT_MINUTES} minutes)"
          if [ "$elapsed" -gt "$limit" ]; then
            echo "::error::this job took ${elapsed}s, over 80% of its ${TIMEOUT_MINUTES}-minute timeout (${limit}s)"
            exit 1
          fi

  # Standing rule: anything that exists to verify something else runs in CI.
  # `examples/mcp_server_git_repro.py` is what users are pointed at to check a
  # crash report against their own server, including a crash report from us --
  # and it shipped broken under the SDK its own instructions install, because
  # nothing ran it. It talks to a stdlib stub here, so no network and no uvx.
  verification-tools:
    runs-on: ubuntu-24.04
    # Higher than `test`: this job installs npm and uv packages over the network
    # and runs real scans against them. Still an order of magnitude under the
    # ceiling that hid the hang.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both majors. The 2.x rename is precisely what went unnoticed.
        mcp-version: ["<2", ">=2,<3"]

    steps:
      # First, before checkout, so the elapsed-time guard at the end of the job
      # covers every step. The runner's own "Set up job" is not counted.
      - name: Start the job clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the virtualenv
        run: uv venv --python 3.12

      - name: Install with mcp ${{ matrix.mcp-version }}
        run: |
          uv pip install -e '.[dev]'
          uv pip install 'mcp${{ matrix.mcp-version }}'

      - name: Report the resolved SDK version
        run: uv run python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"

      - name: Verification tools
        run: uv run pytest tests/test_verification_tools.py -q

      - name: The repro script, end to end against the stub
        run: |
          uv run python examples/mcp_server_git_repro.py \
            --server "$(uv run python -c 'import shlex,sys;print(shlex.join([sys.executable,"tests/fixtures/stub_mcp_server.py"]))')"

      # The two gate checkers. Both re-derive a published finding from shipped
      # evidence, both import nothing from this package, and until 1.7.2
      # **neither ran anywhere** -- the standing rule above names the repro
      # script and stopped there, so the scripts backing the README's two
      # strongest claims were the one kind of verifier nothing verified.
      #
      # `python3`, not `uv run`: they are stdlib-only by construction, and
      # running them under the project environment would not show that. They
      # take about a second between them and need no network.
      - name: Gate D checker (examples/phase-d-gate)
        run: python3 examples/phase-d-gate/verify_gate.py

      - name: Gate BD checker (examples/gate-bd)
        run: python3 examples/gate-bd/verify_gate_bd.py

      # Gate S: the arms of record, the confounded Claude Code run it keeps as
      # evidence, and the exact tests -- which exit 1 if a published p-value is
      # not the one the shipped ledgers give. The checker's failure branches run
      # in the suite (tests/test_gate_s_checker.py), so both directions are live.
      - name: Gate S checker (examples/gate-s)
        run: |
          python3 examples/gate-s/verify_gate_s.py
          python3 examples/gate-s/verify_gate_s.py --root examples/gate-s/confounded --stacks claude-code
          python3 examples/gate-s/fisher_contrasts.py

      # The shipped databases are read `immutable=1` so the checker cannot
      # create `-wal`/`-shm` beside them. Assert it rather than trust it: a
      # sidecar appearing here is a checker that opened the evidence writably.
      - name: The gate checkers leave the evidence untouched
        run: |
          git diff --exit-code -- examples/
          test -z "$(git status --porcelain -- examples/)" || {
            echo "::error::a gate checker wrote beside the shipped evidence"
            git status --porcelain -- examples/
            exit 1
          }

      # Streamable HTTP against a real server, on both SDK majors. The transport
      # helper indexes the yielded streams rather than unpacking them, because
      # 1.x yields three and 2.x yields two -- a difference invisible to whoever
      # writes the code on whichever major they have installed. This matrix is
      # what makes that concrete rather than a comment.
      - name: Start a Streamable HTTP MCP server
        run: |
          npx -y @modelcontextprotocol/server-everything streamableHttp &
          ci/wait-for-endpoint.sh respond http://localhost:3001/mcp

      - name: Scan it over http://
        run: |
          # Explicit, not derived. Left unset, the budget comes out at
          # `timeout_s * requests * 4` = 960s -- a number nobody chose, in a job
          # whose whole purpose is to fail fast. Same shape as the 2400s default
          # already fixed for users.
          uv run ratemyagent scan --target mcp --uri http://localhost:3001/mcp \
            --tool echo --tool-args '{"message":"ci"}' --scan-timeout 120 \
            --requests 8 --probes latency --output scorecard | tee /tmp/http-scan.txt
          grep -q 'mcp via http' /tmp/http-scan.txt
          # A local HTTP round trip is milliseconds, not sub-millisecond stdio.
          grep -qE 'p50 [0-9.]+ms' /tmp/http-scan.txt

      # sse:// shipped before 0.1.7 and was first exercised on 2026-09-09 --
      # by hand, against a real server, three years of releases after it became
      # public API. It worked, which proves one run and not the transport. Unit
      # tests cover the branch and the SDK signature; this covers the wire.
      #
      # Deprecated by the 2025-06-18 spec and still what every older server
      # speaks, so "deprecated" is a reason to keep testing it, not to stop.
      # A second port rather than replacing the first: the header-delivery
      # tests below need both transports live at once, and `sse` and
      # `streamableHttp` are different server modes.
      - name: Start the same server over the deprecated SSE transport
        run: |
          PORT=3005 npx -y @modelcontextprotocol/server-everything sse &
          # `stream`, not `respond`: `/sse` holds the connection open, so a bare
          # GET never returns and the readiness check that used one hung for six
          # hours a run. See ci/wait-for-endpoint.sh.
          ci/wait-for-endpoint.sh stream http://localhost:3005/sse

      - name: Scan it over sse://
        run: |
          uv run ratemyagent scan --target mcp --uri sse://localhost:3005/sse \
            --tool echo --tool-args '{"message":"ci"}' --scan-timeout 120 \
            --requests 8 --probes latency --output scorecard | tee /tmp/sse-scan.txt
          grep -q 'mcp via sse' /tmp/sse-scan.txt
          grep -qE 'p50 [0-9.]+ms' /tmp/sse-scan.txt

      # `--header` shipped in 0.1.7 with redaction tested and delivery never
      # tested, and went thirteen releases without an authenticated run against
      # a real server. Redacting a token you never sent is safe and useless.
      # These assert the bytes, through a recording proxy, on both transports.
      - name: Headers reach the wire, both transports
        run: uv run pytest tests/test_targets/test_header_delivery.py -q

      # Last, and `always()`, so it reports after a failed step too. A job that
      # passes inside its timeout but near it is the next release's timeout:
      # at 1.7.5 the mcp 2.x test jobs reached the 15-minute bound (two were
      # cancelled, one passed at 14:43) and the bound went to 30 with nothing
      # to say how close the suite had come. Failing at 80% makes the margin a
      # failure while it still exists, instead of a cancelled run later.
      - name: Fail if this job used more than 80% of its timeout
        if: always()
        env:
          # Must equal this job's timeout-minutes (tests/test_ci_readiness.py).
          TIMEOUT_MINUTES: 20
        run: |
          : "${JOB_STARTED_AT:?the job clock step did not run}"
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          limit=$(( TIMEOUT_MINUTES * 60 * 8 / 10 ))
          echo "job elapsed ${elapsed}s; limit ${limit}s (80% of ${TIMEOUT_MINUTES} minutes)"
          if [ "$elapsed" -gt "$limit" ]; then
            echo "::error::this job took ${elapsed}s, over 80% of its ${TIMEOUT_MINUTES}-minute timeout (${limit}s)"
            exit 1
          fi

  # The two runners the README's walkthrough fetches (1.9.0, DESIGN-TIER-1 §3),
  # at $0: `--scripted`, so no model is built and no key is read. Each leg is
  # Gate S's task, seed and close against the event twin, and asserts Gate S's
  # by-construction result at the runners' pinned versions -- the stack raises
  # on the closed session whatever the model, so the agent claims failure on
  # work that landed (`lost_acknowledgements == 1`), and its retry never reaches
  # the proxy. An SDK change that breaks the runner or the mechanism fails here.
  #
  # `uv run --script` resolves each runner's PEP 723 pins in isolation, which is
  # also the proof that the runners depend on nothing in this package.
  example-runners:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [run_openai_agents.py, run_langgraph.py]

    steps:
      # First, before checkout, so the elapsed-time guard at the end of the job
      # covers every step. The runner's own "Set up job" is not counted.
      - name: Start the job clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the virtualenv
        run: uv venv --python 3.12

      - name: Install
        run: uv pip install -e .

      # A scripted mode that fell back to a real model must not be able to
      # spend, so the job refuses to run with a key in its environment at all.
      - name: No model API key is set
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ] || [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "::error::a model API key is set; the scripted runners must run without one"
            exit 1
          fi

      # Gate S's task with an `idempotency_key` added. Without a key on the call
      # `retry_keys` reads "not read", and a retry that did reach the proxy
      # would be invisible to the assertion below.
      - name: Scan with the ${{ matrix.runner }} runner, scripted
        run: |
          python3 - "$RUNNER_TEMP/tasks.json" <<'PY'
          import json, sys
          tasks = json.load(open("examples/gate-s/tasks-gate-s.json"))
          tasks["tasks"][0]["arguments"]["idempotency_key"] = "gate-s-ci-1"
          json.dump(tasks, open(sys.argv[1], "w"), indent=2)
          PY
          set +e
          .venv/bin/ratemyagent ci --target agent --agent-kind llm \
            --agent "uv run --script examples/runners/${{ matrix.runner }} --scripted" \
            --agent-command '--config {config} --prompt {prompt} --tasks {tasks} --task {task_id}' \
            --tasks "$RUNNER_TEMP/tasks.json" \
            --upstream "stdio://tests/fixtures/event_twin_mcp_server.py --mode append --key-scope operation --role {role} --state $RUNNER_TEMP/state.jsonl --calls $RUNNER_TEMP/calls.jsonl" \
            --verify-tool effects --verify-count entries --allow-mutating \
            --timeout 180 --fault-rate 0.2 --seed 254 --lost-reply-close-after 5 \
            --work-dir "$RUNNER_TEMP/work" --json-out "$RUNNER_TEMP/out.json" \
            | tee "$RUNNER_TEMP/stdout.txt"
          echo "CI_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Assert Gate S's result on --json-out
        run: |
          python3 - "$RUNNER_TEMP" "$CI_EXIT" <<'PY'
          import json, pathlib, sys
          out, code = pathlib.Path(sys.argv[1]), int(sys.argv[2])
          assert code == 0, f"ci exited {code}"
          record = [json.loads(line) for line in
                    (out / "work/record-chaos-t1.jsonl").read_text().splitlines() if line.strip()]
          calls = [row for row in record if row.get("kind", "invocation") == "invocation"]
          assert calls, "the chaos record holds no call"
          probes = {p["probe"]: p["metrics"] for p in json.loads((out / "out.json").read_text())["probes"]}
          fault, behavior = probes["fault"], probes["behavior"]
          assert fault["task_outcomes"]["t1"] in ("completed", "failed"), "no claim was parsed"
          assert behavior["lost_acknowledgements"] == 1, behavior["lost_acknowledgements"]
          assert behavior["retry_keys"] == {"kept": 0, "changed": 0, "no_key": 0}, behavior["retry_keys"]
          assert "PASS, UNRECONCILED" in (out / "stdout.txt").read_text()
          print(f"ok: {len(calls)} call(s), claim {fault['task_claims']['t1']}, "
                f"lost_acknowledgements 1, no retry reached the proxy")
          PY

      # Last, and `always()`, so it reports after a failed step too.
      - name: Fail if this job used more than 80% of its timeout
        if: always()
        env:
          # Must equal this job's timeout-minutes (tests/test_ci_readiness.py).
          TIMEOUT_MINUTES: 15
        run: |
          : "${JOB_STARTED_AT:?the job clock step did not run}"
          elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
          limit=$(( TIMEOUT_MINUTES * 60 * 8 / 10 ))
          echo "job elapsed ${elapsed}s; limit ${limit}s (80% of ${TIMEOUT_MINUTES} minutes)"
          if [ "$elapsed" -gt "$limit" ]; then
            echo "::error::this job took ${elapsed}s, over 80% of its ${TIMEOUT_MINUTES}-minute timeout (${limit}s)"
            exit 1
          fi
