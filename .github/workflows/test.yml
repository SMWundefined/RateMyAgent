name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One version failing should still report the other three.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv downloads the interpreter itself, so no separate setup-python step.
      - name: Create the virtualenv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install
        run: uv pip install -e '.[dev]'

      - name: Test
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check
