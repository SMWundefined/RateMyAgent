<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 680" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>RateMyAgent architecture</title>
  <desc>Three-phase scan pipeline: CLI feeds target adapters, which flow through baseline probes, fault injection via FaultProxy, behavior analysis, policy scoring, and three output formats</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
    @media (prefers-color-scheme: light) {
      .bg-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .bg-gray text { fill: #2C2C2A; }
      .bg-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .bg-purple text { fill: #26215C; }
      .bg-purple .ts { fill: #534AB7; }
      .bg-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .bg-teal text { fill: #04342C; }
      .bg-teal .ts { fill: #0F6E56; }
      .bg-coral rect { fill: #FAECE7; stroke: #993C1D; }
      .bg-coral text { fill: #4A1B0C; }
      .bg-coral .ts { fill: #993C1D; }
      .bg-green rect { fill: #EAF3DE; stroke: #3B6D11; }
      .bg-green text { fill: #173404; }
      .bg-green .ts { fill: #3B6D11; }
      .arrow { stroke: #888780; }
    }
    @media (prefers-color-scheme: dark) {
      .bg-gray rect { fill: #2C2C2A; stroke: #B4B2A9; }
      .bg-gray text { fill: #F1EFE8; }
      .bg-purple rect { fill: #26215C; stroke: #AFA9EC; }
      .bg-purple text { fill: #EEEDFE; }
      .bg-purple .ts { fill: #CECBF6; }
      .bg-teal rect { fill: #04342C; stroke: #5DCAA5; }
      .bg-teal text { fill: #E1F5EE; }
      .bg-teal .ts { fill: #9FE1CB; }
      .bg-coral rect { fill: #4A1B0C; stroke: #F0997B; }
      .bg-coral text { fill: #FAECE7; }
      .bg-coral .ts { fill: #F5C4B3; }
      .bg-green rect { fill: #173404; stroke: #97C459; }
      .bg-green text { fill: #EAF3DE; }
      .bg-green .ts { fill: #C0DD97; }
      .arrow { stroke: #B4B2A9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="bg-gray">
    <rect x="190" y="20" width="300" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">ratemyagent scan / chaos / ci</text>
  </g>

  <line x1="340" y1="64" x2="340" y2="88" class="arrow" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="bg-gray">
    <rect x="190" y="88" width="300" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="110" text-anchor="middle" dominant-baseline="central">Target adapter</text>
  </g>

  <g class="bg-coral">
    <rect x="100" y="148" width="110" height="32" rx="6" stroke-width="0.5"/>
    <text class="ts" x="155" y="164" text-anchor="middle" dominant-baseline="central">MCP server</text>
  </g>
  <g class="bg-coral">
    <rect x="228" y="148" width="100" height="32" rx="6" stroke-width="0.5"/>
    <text class="ts" x="278" y="164" text-anchor="middle" dominant-baseline="central">Anthropic</text>
  </g>
  <g class="bg-coral">
    <rect x="346" y="148" width="100" height="32" rx="6" stroke-width="0.5"/>
    <text class="ts" x="396" y="164" text-anchor="middle" dominant-baseline="central">OpenAI</text>
  </g>
  <g class="bg-coral">
    <rect x="464" y="148" width="100" height="32" rx="6" stroke-width="0.5"/>
    <text class="ts" x="514" y="164" text-anchor="middle" dominant-baseline="central">Mock</text>
  </g>

  <line x1="340" y1="180" x2="340" y2="208" class="arrow" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="bg-purple">
    <rect x="80" y="208" width="520" height="76" rx="12" stroke-width="0.5"/>
    <text class="th" x="340" y="230" text-anchor="middle">Baseline</text>
    <rect x="100" y="244" width="100" height="28" rx="6" stroke-width="0.5"/>
    <text class="ts" x="150" y="258" text-anchor="middle" dominant-baseline="central">Latency</text>
    <rect x="214" y="244" width="90" height="28" rx="6" stroke-width="0.5"/>
    <text class="ts" x="259" y="258" text-anchor="middle" dominant-baseline="central">Cost</text>
    <rect x="318" y="244" width="110" height="28" rx="6" stroke-width="0.5"/>
    <text class="ts" x="373" y="258" text-anchor="middle" dominant-baseline="central">Concurrency</text>
    <rect x="442" y="244" width="100" height="28" rx="6" stroke-width="0.5"/>
    <text class="ts" x="492" y="258" text-anchor="middle" dominant-baseline="central">Contract</text>
  </g>

  <line x1="340" y1="284" x2="340" y2="312" class="arrow" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="bg-teal">
    <rect x="80" y="312" width="520" height="76" rx="12" stroke-width="0.5"/>
    <text class="th" x="340" y="334" text-anchor="middle">Fault injection</text>
    <rect x="100" y="348" width="86" height="28" rx="6" stroke-width="0.5"/>
    <text class="ts" x="143" y="362" text-anchor="middle" dominant-baseline="central">Timeout</text>
    <rect x="200" y="348" width="60" height="28" rx="6" stroke-width="0.5"/>
    <text class="ts" x="230" y="362" text-anchor="middle" dominant-baseline="central">429</text>
    <rect x="274" y="348" width="60" height="28" rx="6" stroke-width="0.5"/>
    <text class="ts" x="304" y="362" text-anchor="middle" dominant-baseline="central">500</text>
    <rect x="348" y="348" width="96" height="28" rx="6" stroke-width="0.5"/>
    <text class="ts" x="396" y="362" text-anchor="middle" dominant-baseline="central">Malformed</text>
    <rect x="458" y="348" width="110" height="28" rx="6" stroke-width="0.5"/>
    <text class="ts" x="513" y="362" text-anchor="middle" dominant-baseline="central">Conn refused</text>
  </g>

  <line x1="340" y1="388" x2="340" y2="416" class="arrow" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="bg-coral">
    <rect x="80" y="416" width="520" height="52" rx="12" stroke-width="0.5"/>
    <text class="th" x="340" y="436" text-anchor="middle">Behavior analysis</text>
    <text class="ts" x="340" y="454" text-anchor="middle">Retries, amplification, recovery, duplicates, loops</text>
  </g>

  <line x1="340" y1="468" x2="340" y2="496" class="arrow" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="bg-gray">
    <rect x="140" y="496" width="400" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="518" text-anchor="middle" dominant-baseline="central">Policy engine (0-100 score, pass/fail)</text>
  </g>

  <line x1="180" y1="540" x2="120" y2="574" class="arrow" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="540" x2="340" y2="574" class="arrow" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="540" x2="560" y2="574" class="arrow" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="bg-green">
    <rect x="50" y="578" width="150" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="125" y="598" text-anchor="middle" dominant-baseline="central">Scorecard</text>
    <text class="ts" x="125" y="616" text-anchor="middle" dominant-baseline="central">Terminal output</text>
  </g>
  <g class="bg-green">
    <rect x="250" y="578" width="180" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="598" text-anchor="middle" dominant-baseline="central">Report</text>
    <text class="ts" x="340" y="616" text-anchor="middle" dominant-baseline="central">Full markdown</text>
  </g>
  <g class="bg-green">
    <rect x="480" y="578" width="150" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="555" y="598" text-anchor="middle" dominant-baseline="central">AGENTS.md</text>
    <text class="ts" x="555" y="616" text-anchor="middle" dominant-baseline="central">Fix guide + deltas</text>
  </g>
</svg>