[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ratemyagent"
version = "1.7.4"
description = "Reliability scanner for MCP servers: fault injection, a scored policy, and a fix guide for coding agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "click>=8.0",
    "pyyaml>=6.0",
    # Core since 1.3.2: scanning MCP servers is what this tool is for, and an
    # extra that the primary use case needs is a footgun -- `pip install
    # ratemyagent` then exited 2 on the SDK rather than scanning.
    #
    # The `<3` bound is deliberate. The SDK renamed its model fields from
    # camelCase to snake_case in 2.0, and every read of them here used
    # `getattr(obj, "camelCase", default)` -- which returns the default rather
    # than raising, so under an uncapped `mcp>=1.0.0` a 2.x install silently
    # reported every tool error as a success. 1.x and 2.x are both handled now
    # (see `_sdk_attr` in targets/mcp.py, with a regression test per major), but
    # an unbounded upper edge is what turned a rename into a scoring bug, so 3.x
    # stays out until it is tested rather than assumed.
    "mcp>=1.0.0,<3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/SMWundefined/RateMyAgent"
Repository = "https://github.com/SMWundefined/RateMyAgent"
Issues = "https://github.com/SMWundefined/RateMyAgent/issues"
Changelog = "https://github.com/SMWundefined/RateMyAgent/releases"

[project.scripts]
ratemyagent = "ratemyagent.cli:main"

[project.optional-dependencies]
# Kept as an empty extra so `pip install 'ratemyagent[mcp]'` -- which every
# release before 1.3.2 documented, and which is in other people's CI files --
# still resolves instead of erroring on an unknown extra. The dependency itself
# moved into [project].dependencies.
mcp = []
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.0.0"]
all = ["anthropic>=0.30.0", "openai>=1.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4.0"]

[tool.setuptools.packages.find]
include = ["ratemyagent*"]

[tool.setuptools.package-data]
# py.typed: PEP 561 marker. The public API is fully annotated; without this file
# mypy and pyright treat the installed package as untyped and ignore all of it.
ratemyagent = ["policies/*.yaml", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Shipped byte-for-byte as they drove Gate S, so a reader sees what ran and the
# evidence README's hashes stay true. Style fixes would make them not the runners.
"examples/gate-s/runners/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Import the package from the source tree so `pytest` works without an install.
pythonpath = ["."]